name: Cucumber Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  test:

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Clean report output
        run: rm -rf Resources/Reports

      - name: Run smoke tests
        id: smoke-tests
        continue-on-error: true
        run: |
          mvn clean test \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dcucumber.filter.tags="@smoke"

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Configure GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/configure-pages@v5

      - name: Upload Allure report to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@v4
        with:
          path: Resources/Reports/allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            Resources/Reports/
            target/surefire-reports/
          if-no-files-found: warn

      - name: Fail workflow if tests failed
        if: steps.smoke-tests.outcome == 'failure'
        run: exit 1
